<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevNotes & Reminders</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2.5rem 1rem;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.75rem;
      letter-spacing: -0.5px;
    }

    header p {
      margin: 0.25rem 0 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Form Container */
    .note-form {
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .form-inputs {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    @media (min-width: 500px) {
      .form-inputs {
        flex-direction: row;
      }
    }

    input[type="text"], input[type="datetime-local"] {
      background: #0b1120;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="datetime-local"]:focus {
      border-color: var(--accent);
    }

    input[type="text"] { flex: 2; }
    input[type="datetime-local"] { flex: 1.5; color-scheme: dark; }

    button.btn-add {
      background: var(--accent);
      color: #042f2e;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-add:hover { background: var(--accent-hover); color: #fff; }

    /* Note Cards */
    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .note-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 1rem 1.25rem;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: transform 0.15s, border-color 0.15s;
    }

    .note-card:hover {
      border-color: #475569;
      transform: translateY(-2px);
    }

    .note-content {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      overflow: hidden;
    }

    .note-text {
      font-size: 1rem;
      font-weight: 500;
      word-break: break-word;
    }

    .badge-date {
      font-size: 0.78rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--text-muted);
    }

    .badge-date.overdue {
      color: #f87171;
    }

    .badge-date.due-soon {
      color: #facc15;
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    /* Notification Banner */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0284c7;
      color: #fff;
      padding: 1rem 1.25rem;
      border-radius: 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      display: none;
      animation: slideIn 0.3s ease;
      z-index: 100;
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Task Workspace</h1>
      <p>Schedule notes and receive local deadline reminders</p>
    </header>

    <div class="note-form">
      <div class="form-inputs">
        <input type="text" id="noteInput" placeholder="What needs to be done?" />
        <input type="datetime-local" id="dateInput" />
      </div>
      <button class="btn-add" onclick="addNote()">Add Task</button>
    </div>

    <div class="notes-list" id="notesList"></div>
  </div>

  <div class="toast" id="toastAlert"></div>
  <script src="script.js"></script>
</body>
</html>
